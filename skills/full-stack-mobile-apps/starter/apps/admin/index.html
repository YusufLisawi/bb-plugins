<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__APP_NAME__ Admin</title>
  <style>
    body { font: 16px system-ui; max-width: 660px; margin: 40px auto; padding: 0 18px; color: #222; }
    label { display: block; margin: 18px 0 6px; }
    input, button { font: inherit; padding: 10px; }
    input { width: min(100%, 420px); box-sizing: border-box; }
    button { cursor: pointer; margin-top: 12px; }
    li { padding: 7px 0; }
    #status { color: #a42222; }
  </style>
</head>
<body>
  <h1>__APP_NAME__ Admin</h1>
  <p>For a single trusted operator. Keep this service behind a private or authenticated edge.</p>
  <label for="token">Admin token</label><input id="token" type="password" autocomplete="off">
  <button id="connect" type="button">Connect</button>
  <form id="addForm">
    <label for="title">New item</label><input id="title" maxlength="120" required>
    <button type="submit">Add item</button>
  </form>
  <p id="status" role="status"></p>
  <ul id="items"></ul>
  <script src="/admin.js" defer></script>
</body>
</html>
